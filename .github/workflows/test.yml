name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # cc-move is Windows-only: it relies on robocopy, NTFS junctions and Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
